name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    timeout-minutes: 20

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git ninja-build python3 python3-venv

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python build tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install "cmake>=3.25" "conan>=2,<3"

          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          ln -sf "$(command -v g++)" /usr/local/bin/g++-15
          conan profile detect --force

      - name: Install dependencies
        run: |
          conan install . \
            --output-folder=build/conan \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=26

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git ninja-build python3 python3-venv

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python build tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install "cmake>=3.25" "conan>=2,<3"

          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          ln -sf "$(command -v g++)" /usr/local/bin/g++-15
          conan profile detect --force

      - name: Install dependencies
        run: |
          conan install . \
            --output-folder=build-coverage/conan \
            --build=missing \
            -s build_type=Debug \
            -s compiler.cppstd=26

      - name: Configure
        run: |
          cmake -S . -B build-coverage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_TOOLCHAIN_FILE=build-coverage/conan/build/Debug/generators/conan_toolchain.cmake

      - name: Build, test, and collect coverage
        run: cmake --build build-coverage --target coverage --parallel

      - name: Publish coverage summary
        id: coverage-summary
        run: |
          coverage_log="$(find build-coverage/Testing/Temporary -name 'LastCoverage_*.log' -print -quit)"
          covered_loc="$(grep 'Covered LOC' "$coverage_log" | awk '{print $3}')"
          not_covered_loc="$(grep 'Not covered LOC' "$coverage_log" | awk '{print $4}')"
          total_loc="$(grep 'Total LOC' "$coverage_log" | awk '{print $3}')"
          percentage="$(grep 'Percentage Coverage' "$coverage_log" | awk '{print $3}')"

          {
            echo "covered_loc=$covered_loc"
            echo "not_covered_loc=$not_covered_loc"
            echo "total_loc=$total_loc"
            echo "percentage=$percentage"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Coverage"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Covered LOC | $covered_loc |"
            echo "| Not covered LOC | $not_covered_loc |"
            echo "| Total LOC | $total_loc |"
            echo "| Coverage | $percentage |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COVERED_LOC: ${{ steps.coverage-summary.outputs.covered_loc }}
          NOT_COVERED_LOC: ${{ steps.coverage-summary.outputs.not_covered_loc }}
          TOTAL_LOC: ${{ steps.coverage-summary.outputs.total_loc }}
          COVERAGE_PERCENTAGE: ${{ steps.coverage-summary.outputs.percentage }}
        with:
          script: |
            const marker = '<!-- design-pattern-overview-coverage -->';
            const body = `${marker}
            ## Coverage

            | Metric | Value |
            | --- | ---: |
            | Covered LOC | ${process.env.COVERED_LOC} |
            | Not covered LOC | ${process.env.NOT_COVERED_LOC} |
            | Total LOC | ${process.env.TOTAL_LOC} |
            | Coverage | ${process.env.COVERAGE_PERCENTAGE} |
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Update coverage badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          COVERAGE_PERCENTAGE: ${{ steps.coverage-summary.outputs.percentage }}
        run: |
          repo_dir="$GITHUB_WORKSPACE"
          percentage_value="${COVERAGE_PERCENTAGE%%%}"
          color="$(awk -v value="$percentage_value" 'BEGIN {
            if (value >= 90) print "brightgreen";
            else if (value >= 80) print "green";
            else if (value >= 70) print "yellowgreen";
            else if (value >= 60) print "yellow";
            else if (value >= 50) print "orange";
            else print "red";
          }')"

          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' \
            "$COVERAGE_PERCENTAGE" \
            "$color" > "$repo_dir/coverage-badge.json"

          if git -C "$repo_dir" diff --quiet -- coverage-badge.json; then
            echo "Coverage badge data is already up to date."
            exit 0
          fi

          git -C "$repo_dir" config user.name "github-actions[bot]"
          git -C "$repo_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo_dir" add coverage-badge.json
          git -C "$repo_dir" commit -m "Update coverage badge"
          git -C "$repo_dir" push

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/Testing/**/Coverage.xml
            build-coverage/Testing/**/CoverageLog-*.xml
