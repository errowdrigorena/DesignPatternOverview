name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    timeout-minutes: 20

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git ninja-build python3 python3-venv

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python build tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install "cmake>=3.25" "conan>=2,<3"

          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          ln -sf "$(command -v g++)" /usr/local/bin/g++-15
          conan profile detect --force

      - name: Install dependencies
        run: |
          conan install . \
            --output-folder=build/conan \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=26

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
