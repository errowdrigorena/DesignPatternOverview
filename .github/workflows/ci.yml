name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    timeout-minutes: 20

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git ninja-build python3 python3-venv

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python build tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install "cmake>=3.25" "conan>=2,<3"

          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          ln -sf "$(command -v g++)" /usr/local/bin/g++-15
          conan profile detect --force

      - name: Install dependencies
        run: |
          conan install . \
            --output-folder=build/conan \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=26

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git ninja-build python3 python3-venv

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python build tools
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install "cmake>=3.25" "conan>=2,<3" "gcovr>=8,<9"

          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          ln -sf "$(command -v g++)" /usr/local/bin/g++-15
          conan profile detect --force

      - name: Install dependencies
        run: |
          conan install . \
            --output-folder=build-coverage/conan \
            --build=missing \
            -s build_type=Debug \
            -s compiler.cppstd=26

      - name: Configure
        run: |
          cmake -S . -B build-coverage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_TOOLCHAIN_FILE=build-coverage/conan/build/Debug/generators/conan_toolchain.cmake

      - name: Build and test with coverage
        run: |
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure

      - name: Publish coverage summary
        id: coverage-summary
        run: |
          gcovr \
            --root . \
            --filter '(.*/)?((CommandPattern|DecoratorPattern|FacadePattern|ObserverPattern|Shapes|SimpleFactoryPseudoPattern|SingletonPattern|StrategyPattern|TemplateMethodPattern|VisitorPattern)/(include|src)/|PrototypePattern/PrototypePattern_(classic|modern)/)' \
            --exclude '(.*/)?[^/]*Demo\.cpp$' \
            --exclude '(.*/)?tests/' \
            --exclude '(.*/)?build-coverage/' \
            --json-summary-pretty \
            --json-summary coverage-summary.json \
            --xml-pretty \
            --xml coverage.xml

          python3 - <<'PY'
          import json
          import os

          with open("coverage-summary.json", encoding="utf-8") as coverage_file:
              coverage = json.load(coverage_file)

          covered_loc = int(coverage["line_covered"])
          total_loc = int(coverage["line_total"])
          not_covered_loc = total_loc - covered_loc
          percentage = f'{float(coverage["line_percent"]):.2f}%'

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"covered_loc={covered_loc}", file=output)
              print(f"not_covered_loc={not_covered_loc}", file=output)
              print(f"total_loc={total_loc}", file=output)
              print(f"percentage={percentage}", file=output)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("## Coverage", file=summary)
              print(file=summary)
              print("| Metric | Value |", file=summary)
              print("| --- | ---: |", file=summary)
              print(f"| Covered LOC | {covered_loc} |", file=summary)
              print(f"| Not covered LOC | {not_covered_loc} |", file=summary)
              print(f"| Total LOC | {total_loc} |", file=summary)
              print(f"| Coverage | {percentage} |", file=summary)
          PY

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COVERED_LOC: ${{ steps.coverage-summary.outputs.covered_loc }}
          NOT_COVERED_LOC: ${{ steps.coverage-summary.outputs.not_covered_loc }}
          TOTAL_LOC: ${{ steps.coverage-summary.outputs.total_loc }}
          COVERAGE_PERCENTAGE: ${{ steps.coverage-summary.outputs.percentage }}
        with:
          script: |
            const marker = '<!-- design-pattern-overview-coverage -->';
            const body = `${marker}
            ## Coverage

            | Metric | Value |
            | --- | ---: |
            | Covered LOC | ${process.env.COVERED_LOC} |
            | Not covered LOC | ${process.env.NOT_COVERED_LOC} |
            | Total LOC | ${process.env.TOTAL_LOC} |
            | Coverage | ${process.env.COVERAGE_PERCENTAGE} |
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Update coverage badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/github-script@v7
        env:
          COVERAGE_PERCENTAGE: ${{ steps.coverage-summary.outputs.percentage }}
        with:
          script: |
            const percentage = process.env.COVERAGE_PERCENTAGE;
            const numericCoverage = Number.parseFloat(percentage);
            let color = 'red';

            if (numericCoverage >= 90) color = 'brightgreen';
            else if (numericCoverage >= 80) color = 'green';
            else if (numericCoverage >= 70) color = 'yellowgreen';
            else if (numericCoverage >= 60) color = 'yellow';
            else if (numericCoverage >= 50) color = 'orange';

            const badge = {
              schemaVersion: 1,
              label: 'coverage',
              message: percentage,
              color,
            };
            const content = `${JSON.stringify(badge)}\n`;
            const encodedContent = Buffer.from(content).toString('base64');
            const { owner, repo } = context.repo;
            const path = 'coverage-badge.json';

            let current;
            try {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: 'master',
              });
              current = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (current && Buffer.from(current.content, 'base64').toString() === content) {
              core.info('Coverage badge data is already up to date.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Update coverage badge',
              content: encodedContent,
              sha: current?.sha,
              branch: 'master',
            });

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-summary.json
            coverage.xml
